<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Signing in… · SnackScout</title>
<style>
  :root { --bg: #fffaf2; --ink: #2b2118; --muted: #7a6a5a; --brand: #e8742a; --card: #fff; --line: #eadfce; }
  @media (prefers-color-scheme: dark) { :root { --bg: #17120d; --ink: #fbf3e8; --muted: #b9a68f; --card: #221a13; --line: #3b2f23; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; box-sizing: border-box; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 30px 26px; max-width: 380px; width: 100%; text-align: center; }
  .spin { width: 28px; height: 28px; margin: 14px auto; border: 3px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  p { color: var(--muted); }
</style>
</head>
<body>
<div class="card">
  <div style="font-size:48px">🍿</div>
  <div id="msg"><div class="spin"></div><p>Finishing Google sign-in…</p></div>
</div>
<script>
// Google sends people here after they sign in. SnackScout put the address of the SnackScout they came from
// (the team laptop's current Cloudflare tunnel) at the start of `state`; forward them back there.
(() => {
  const q = new URLSearchParams(location.search);
  const fail = text => { document.getElementById('msg').innerHTML = '<p><b>Sign-in couldn\'t finish.</b></p><p>' + text + '</p>'; };
  const state = q.get('state') || '';
  let origin = '';
  try {
    const b64 = state.split('~')[0].replace(/-/g, '+').replace(/_/g, '/');
    origin = atob(b64 + '='.repeat((4 - b64.length % 4) % 4));
  } catch (e) {}
  if (!/^https:\/\/[a-z0-9-]+\.trycloudflare\.com$/.test(origin)) return fail('This sign-in link is broken. Go back to SnackScout and try again.');
  location.replace(origin + '/auth/google/callback' + location.search);
})();
</script>
</body>
</html>
